version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    # Universal/multi-arch builds invoke this concurrently from parallel deps;
    # two `go mod tidy` processes racing on go.mod can corrupt it (#4637).
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    run: once
    cmds:
      - task: install:frontend:deps:{{.PACKAGE_MANAGER}}

  install:frontend:deps:npm:
    dir: web
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "Looks like npm isn't installed. Npm is part of the Node installer: https://nodejs.org/en/download/"
    cmds:
      - npm install

  install:frontend:deps:bun:
    dir: web
    sources:
      - package.json
      - bun.lock
      - bun.lockb
    generates:
      - node_modules
    preconditions:
      - sh: bun --version
        msg: "bun not found"
    cmds:
      - bun install

  install:frontend:deps:pnpm:
    dir: web
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules
    preconditions:
      - sh: pnpm --version
        msg: "pnpm not found"
    cmds:
      - pnpm install

  install:frontend:deps:yarn:
    dir: web
    sources:
      - package.json
      - yarn.lock
    status:
      - test -d node_modules || test -f .pnp.cjs
    preconditions:
      - sh: yarn --version
        msg: "yarn not found"
    cmds:
      - yarn install

  build:frontend:
    label: build:frontend (DEV={{.DEV}} RUNNER={{.PACKAGE_MANAGER}})
    summary: Build the frontend project
    # darwin:build:universal runs its per-arch builds as parallel deps, each of
    # which depends on this task. Without run:once the two executions race:
    # one regenerates web/bindings (-clean deletes it first) while the
    # other's bundler is reading it, failing intermittently with
    # 'Could not resolve "./bindings/<pkg>"' (#4637).
    run: once
    dir: web
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
    cmds:
      - task: frontend:run
        vars:
          SCRIPT: '{{if eq .DEV "true"}}build:dev{{else}}build{{end}}'
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  frontend:run:
    summary: Run a frontend script with selected runner
    cmds:
      - task: frontend:run:{{.PACKAGE_MANAGER}}
        vars:
          SCRIPT: "{{.SCRIPT}}"
    vars:
      SCRIPT: "{{.SCRIPT}}"

  frontend:run:npm:
    dir: web
    cmds:
      - npm run {{.SCRIPT}} -q
    vars:
      SCRIPT: "{{.SCRIPT}}"

  frontend:run:yarn:
    dir: web
    cmds:
      - yarn {{.SCRIPT}}
    vars:
      SCRIPT: "{{.SCRIPT}}"

  frontend:run:pnpm:
    dir: web
    cmds:
      - pnpm run {{.SCRIPT}}
    vars:
      SCRIPT: "{{.SCRIPT}}"

  frontend:run:bun:
    dir: web
    cmds:
      - bun run {{.SCRIPT}}
    vars:
      SCRIPT: "{{.SCRIPT}}"



  generate:bindings:
    summary: Generates bindings for the frontend
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.[jt]s"
      - exclude: web/**/*
      - web/bindings/**/*  # Rerun when switching between dev/production mode causes changes in output
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - web/bindings/**/*
    cmds:
      - wails3 generate bindings -d web/bindings -f '{{.BUILD_FLAGS}}' -clean=true{{if eq .OBFUSCATED "true"}} -obfuscated{{end}} -ts -i

  generate:icons:
    summary: Generates the macOS app icon, using the layered Ponder icon when Xcode is available.
    run: once
    dir: build
    cmds:
      - |
        ICON_SRC="{{.ROOT_DIR}}/build/icon-source/Ponder.icon"
        OUT_DIR="{{.ROOT_DIR}}/build/darwin"
        # actool can be present but non-functional (e.g. after an Xcode upgrade
        # before `xcodebuild -runFirstLaunch` reinstalls its plug-ins), so probe
        # the real compile and fall back to the flat PNG icon on any failure
        # instead of aborting the whole build.
        if [ -d "$ICON_SRC" ] && command -v xcrun >/dev/null 2>&1 && xcrun --find actool >/dev/null 2>&1 &&
          xcrun actool "$ICON_SRC" \
            --compile "$OUT_DIR" \
            --notices --warnings --errors \
            --output-partial-info-plist "$OUT_DIR/temp.plist" \
            --app-icon Ponder \
            --enable-on-demand-resources NO \
            --development-region en \
            --target-device mac \
            --minimum-deployment-target 26.0 \
            --platform macosx; then
          cp "$OUT_DIR/Ponder.icns" "$OUT_DIR/icons.icns"
          rm -f "$OUT_DIR/Ponder.icns" "$OUT_DIR/temp.plist"
        else
          echo "generate:icons: actool unavailable or failed; using flat PNG icon (run 'xcodebuild -runFirstLaunch' to restore the layered icon)" >&2
          rm -f "$OUT_DIR/Assets.car" "$OUT_DIR/Ponder.icns" "$OUT_DIR/temp.plist"
          wails3 generate icons -input "{{.ROOT_DIR}}/build/appicon-macos.png" -macfilename "$OUT_DIR/icons.icns" -windowsfilename ""
        fi

  dev:frontend:
    summary: Runs the frontend in development mode
    deps:
      - task: install:frontend:deps
    cmds:
      - task: frontend:dev:{{.PACKAGE_MANAGER}}

  frontend:dev:npm:
    dir: web
    cmds:
      - npm run dev:desktop -- --port {{.VITE_PORT}} --strictPort

  frontend:dev:yarn:
    dir: web
    cmds:
      - yarn dev:desktop --port {{.VITE_PORT}} --strictPort

  frontend:dev:pnpm:
    dir: web
    cmds:
      - pnpm dev:desktop --port {{.VITE_PORT}} --strictPort

  frontend:dev:bun:
    dir: web
    cmds:
      - bun run dev:desktop --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Updates the build assets
    # This regenerates every platform's folder, including windows/, linux/ and
    # ios/. Ponder is macOS only, so delete those again after running it.
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
